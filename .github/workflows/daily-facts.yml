name: Daily Full-Website Content Scheduler

on:
  schedule:
    # Run once every day at 00:00 UTC
    - cron: "0 0 * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-site-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily clinical content across all website sections
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generate-daily-facts.ts

      - name: Validate data integrity and tests
        run: npm test

      - name: Commit and push daily website update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(content): daily automated full-website clinical content update [skip ci]" && git push)
